name: lts-control-center

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lts_control}
      POSTGRES_USER: ${POSTGRES_USER:-lts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lts} -d ${POSTGRES_DB:-lts_control}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    init: true
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      NODE_ENV: production
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:?Set APP_PORT in .env}:3000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 35s
      retries: 3

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
