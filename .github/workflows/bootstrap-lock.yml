name: Bootstrap npm lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Switch Docker build to npm ci
        run: |
          python3 - <<'PY'
          from pathlib import Path
          docker = Path('Dockerfile')
          text = docker.read_text()
          text = text.replace('COPY package.json ./', 'COPY package.json package-lock.json ./')
          text = text.replace('RUN npm install', 'RUN npm ci')
          docker.write_text(text)
          PY
      - name: Commit lockfile
        run: |
          git add package-lock.json Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock npm dependencies for Docker"
          git push
